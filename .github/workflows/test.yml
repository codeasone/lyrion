name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # A hung test would otherwise run for six hours.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: purcell/setup-emacs@v8.0
        with:
          version: "30.1"
      - run: make lint
      # Runs the tests too, and fails below the coverage minimum.
      - run: make coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info
